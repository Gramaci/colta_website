<!DOCTYPE html>
<html lang="en" class="lang-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colta</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F7F6F2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="not-found">
    <div class="lang-toggle not-found-lang">
        <button id="lang-en">EN</button>
        <button id="lang-fr">FR</button>
    </div>

    <main class="not-found-card">
        <img class="not-found-mark" src="/logo.png" alt="Colta">
        <h1 class="fr-only">Télécharge Colta</h1>
        <h1 class="en-only">Download Colta</h1>
        <p class="fr-only">Gratuit sur iPhone et Android.</p>
        <p class="en-only">Free on iPhone and Android.</p>
        <div class="store-badges">
            <a href="https://apps.apple.com/fr/app/colta/id6759000296?l=en-GB" class="app-store-badge" aria-label="Download on the App Store">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.colta.app" class="play-store-badge" aria-label="Get it on Google Play">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
            </a>
        </div>
        <a class="not-found-home" href="/"><span class="fr-only">Accueil</span><span class="en-only">Home</span></a>
    </main>

    <script src="/lang.js"></script>
</body>
</html>
